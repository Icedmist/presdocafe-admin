<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disconnected — PresdoCafe Wi-Fi</title>
  <style>
    body { margin:0; min-height:100vh; font-family:system-ui,sans-serif; background:#020617; color:#f8fafc; display:grid; place-items:center; padding:1.25rem; }
    .card { max-width:400px; width:100%; background:#0f172a; border:1px solid #1e293b; border-radius:16px; padding:1.75rem; text-align:center; }
    h2 { margin:0 0 .5rem; }
    p { color:#94a3b8; font-size:.9rem; margin-bottom:1.25rem; }
    a { display:inline-block; padding:.75rem 1.25rem; border-radius:10px; background:#38bdf8; color:#020617; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Session Disconnected</h2>
    <p>You have logged out of PresdoCafe Wi-Fi (used $(uptime), $(bytes-out-nice) down).</p>
    <a href="$(link-login)">Log Back In</a>
  </div>
</body>
</html>
