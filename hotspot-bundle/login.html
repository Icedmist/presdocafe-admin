<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PresdoCafe Wi-Fi — Voucher Access</title>
  <style>
    :root{--bg:#060a13;--card:rgba(15,23,42,.84);--border:rgba(148,163,184,.2);--text:#f8fafc;--muted:#94a3b8;--sky:#38bdf8;--sky2:#0284c7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:var(--text);
      background:radial-gradient(circle at top,#132542,var(--bg) 68%),url("./bg.jpg") center/cover no-repeat fixed;
      display:grid;place-items:center;padding:1.25rem}
    .card{width:100%;max-width:430px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);
      border-radius:20px;padding:1.8rem;box-shadow:0 28px 70px rgba(0,0,0,.55)}
    .brand{display:flex;align-items:center;gap:.9rem;margin-bottom:1.3rem}
    .brand img{width:50px;height:50px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,.06);padding:5px}
    .brand h1{margin:0;font-size:1.22rem;letter-spacing:-.01em}
    .brand p{margin:.2rem 0 0;font-size:.85rem;color:var(--muted)}
    .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:1.3rem}
    .pill{background:rgba(30,41,59,.72);border:1px solid rgba(148,163,184,.16);border-radius:12px;padding:.65rem .45rem;text-align:center}
    .pill strong{display:block;color:var(--sky);font-size:.85rem}
    .pill span{display:block;font-size:.76rem;color:#e2e8f0;margin-top:.15rem}
    .pill small{display:block;font-size:.72rem;color:var(--muted);margin-top:.1rem}
    form{display:grid;gap:.8rem}
    input[type="text"]{width:100%;padding:.9rem 1rem;border-radius:12px;border:1px solid rgba(148,163,184,.3);
      background:rgba(2,6,23,.82);color:var(--text);font-size:1.02rem;letter-spacing:.08em;text-transform:uppercase;text-align:center}
    input[type="text"]:focus{outline:none;border-color:var(--sky)}
    button{width:100%;padding:.9rem 1rem;border:0;border-radius:12px;background:linear-gradient(135deg,var(--sky2),var(--sky));
      color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
    .err{margin-top:.85rem;color:#fca5a5;font-size:.85rem;text-align:center;min-height:1.1em}
    .foot{margin-top:1rem;text-align:center;font-size:.76rem;color:var(--muted)}
  </style>
</head>
<body>
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
  </form>
  <script src="./md5.js"></script>
  <script>
    function doLoginVoucher(){
      var code = document.getElementById("voucher").value.trim().toUpperCase();
      if(!code) return false;
      document.sendin.username.value = code;
      document.sendin.password.value = hexMD5('$(chap-id)' + code + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)

  <div class="card">
    <div class="brand">
      <img src="./logo.png" alt="PresdoCafe Logo" onerror="this.style.display='none'" />
      <div>
        <h1>PresdoCafe Wi-Fi</h1>
        <p>Fast, reliable internet • presdocafe.ng</p>
      </div>
    </div>

    <div class="plans">
      <div class="pill"><strong>1H • 2GB</strong><span>₦500</span><small>5 Mbps</small></div>
      <div class="pill"><strong>24H • 10GB</strong><span>₦1,500</span><small>10 Mbps</small></div>
      <div class="pill"><strong>7D • UNLIM</strong><span>₦5,000</span><small>8 Mbps</small></div>
    </div>

    <form name="login" action="$(link-login-only)" method="post"
      $(if chap-id)onsubmit="return doLoginVoucher();"$(else)onsubmit="var c=document.getElementById('voucher').value.trim().toUpperCase();document.getElementById('voucher').value=c;document.login.password.value=c;return true;"$(endif)>
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input id="voucher" name="username" type="text" placeholder="ENTER VOUCHER CODE" autocomplete="off" required />
      <input name="password" type="hidden" />
      <button type="submit">Connect to Internet</button>
    </form>

    <div class="err">$(if error)$(error)$(endif)</div>
    <div class="foot">Locked to first device used • Ask staff for a voucher code</div>
  </div>
</body>
</html>
